# Render Blueprint for the Aegis Shield BACKEND + database.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# The FRONTEND is NOT here -- it deploys to GitHub Pages via
# .github/workflows/deploy-pages.yml. This blueprint provisions only the
# FastAPI backend and its Postgres database, which GitHub Pages cannot run.
#
# After the backend's URL is known, do two things:
#   1. Set the repo Actions variable VITE_API_BASE to that URL so the Pages
#      frontend talks to it (Settings -> Secrets and variables -> Actions).
#   2. Confirm CORS_ORIGINS below matches your GitHub Pages origin.
#
# ADMIN_PASSWORD and JWT_SECRET are marked sync:false (generateValue for
# JWT_SECRET) so they are never written into this file or git history --
# Render prompts for/creates them at blueprint-apply time.
databases:
  - name: aegis-shield-db
    plan: free
    databaseName: aegis_saas
    user: aegis_saas

services:
  - type: web
    name: aegis-shield-backend
    runtime: docker
    dockerfilePath: ./saas-platform/backend/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-shield-db
          property: connectionString
      - key: AEGIS_REPO_PATH
        value: /app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://syedj-hacks.github.io
