# Project metadata and tool configuration for Aegis Scanner.

[tool.ruff]
# Match the CI Python and the codebase's line habit (long, explanatory
# comment blocks are deliberate here — see any wrapper module).
target-version = "py311"
line-length = 120
exclude = [
    "venv", ".git", "__pycache__", "output",
    "presentation", "smoke_test",
    # config.example.py is a template with intentional placeholder shapes.
    "modules/utils/config.example.py",
]

[tool.ruff.lint]
# A deliberately focused rule set. This is a security tool that shells out
# to subprocesses and holds a hard "never raises" contract across every
# wrapper, so some defaults fight the design rather than improve it:
#   E501  long lines — the code documents itself in long comment blocks
#   E402  module-level import not at top — a few modules import after a
#         sys.path shim (the test/entry pattern)
#   E722/BLE001 bare/broad except — the "never raises" contract IS broad
#         excepts, on purpose and documented at each site
#   F401  in __init__ re-exports — the package surfaces names deliberately
# Selected: the correctness-relevant checks (pyflakes F, a pycodestyle
# subset E/W) that catch real mistakes — undefined names, unused variables,
# syntax issues — without waging war on the house style.
select = ["F", "E", "W"]
# In addition to the design-driven ignores above, these cover the
# established house style rather than the code fighting the linter:
#   E701/E702  compact `if x: ok += 1` / `a; b` — used throughout the test
#              harnesses on purpose, to keep each assertion one readable line
#   E401       several stdlib imports on one line, a long-standing habit here
#   W291/W293/W292  trailing/blank-line whitespace — cosmetic, not a defect
ignore = ["E501", "E402", "E722", "E741", "W605",
          "E701", "E702", "E401", "W291", "W293", "W292"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their public surface; unused-import there
# is the intent, not a mistake.
"__init__.py" = ["F401"]
"plugins/__init__.py" = ["F401"]
"modules/engine/__init__.py" = ["F401"]
# Tests import for side effects and shadow names across sections freely.
"tests/*" = ["F811", "F841", "E731", "F401"]
# Two pre-existing dead assignments kept for readability at their call
# sites (a named intermediate that documents what the following line
# operates on). Not worth rewriting working, live-verified scan code to
# satisfy the linter; scoped here so the rule still applies everywhere else.
"modules/profiles/webaudit.py" = ["F841"]
"modules/scanning/port_scanner.py" = ["F841"]
