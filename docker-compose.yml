# docker-compose.yml
# Two independent things live here:
#
#   1. `app`  — the Aegis Shield web platform (FastAPI backend that also serves
#               the React frontend) on a single port, backed by SQLite on a
#               persistent volume. This is the LOCAL ONE-CLICK RUN target:
#
#                   docker compose up --build       (run.sh / run.bat do this)
#
#               then open http://localhost:8000. There is one container on
#               purpose: the backend serves the built frontend at / (so the
#               frontend needs no separate service), and SQLite-in-a-volume
#               means no database service to run. Commented blocks below show
#               how to switch to a Postgres `db` service if you want one.
#
#   2. `zap`  — the containerised OWASP ZAP daemon (item 9), used only to give
#               deepscan a clean ZAP. It is gated behind the `zap` profile, so
#               a plain `docker compose up` does NOT start it. Start it exactly
#               as before, by naming it:
#
#                   docker compose up -d zap
#                   echo 'ZAP_HOST=127.0.0.1' >> .env
#                   echo 'ZAP_PORT=8090'      >> .env
#
#               and the recovery one-liner still works (see docker/zap/Dockerfile
#               for the failure it addresses, and TUTORIAL.md for when to use it):
#
#                   docker compose restart zap     # guaranteed-fresh ~/.ZAP profile

services:
  # --------------------------------------------------------------- web app
  app:
    build:
      # Build context is the repo ROOT so the backend can import the Aegis
      # engine as a library; the same Dockerfile is reused for SnapDeploy and
      # Render so behaviour is identical everywhere (see DEPLOY.md).
      context: .
      dockerfile: saas-platform/backend/Dockerfile
    image: aegis-shield:local
    container_name: aegis-shield
    # First run creates .env from .env.example (run.sh / run.bat do this).
    env_file:
      - .env
    environment:
      # SQLite on the named volume below. Absolute path (four slashes) so it is
      # the same file regardless of working directory. Override DATABASE_URL in
      # .env to point at Postgres instead.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/saas-platform/backend/data/aegis_shield.db}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Everything that must survive a container rebuild lives on named volumes:
      - aegis-appdata:/app/saas-platform/backend/data   # SaaS DB (users, jobs)
      - aegis-scandb:/app/database                      # engine scan history
      - aegis-output:/app/output                        # generated reports
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    restart: unless-stopped

    # ---- Want a real Postgres instead of SQLite? ------------------------
    # 1. Uncomment the `db` service at the bottom of this file.
    # 2. Set in .env:
    #       DATABASE_URL=postgresql+psycopg2://aegis:aegis@db:5432/aegis
    # 3. Uncomment depends_on below so the app waits for the database.
    # depends_on:
    #   db:
    #     condition: service_healthy

  # ------------------------------------------------------------------- zap
  zap:
    profiles: ["zap"]   # not started by a plain `docker compose up`
    build:
      context: ./docker/zap
    image: aegis-zap:local
    container_name: aegis-zap

    # Bound to LOOPBACK ONLY, deliberately.
    #
    # This daemon runs with api.disablekey=true — no API key — which is
    # what lets zap_wrap.py talk to it without managing a shared secret.
    # An unauthenticated ZAP API is a full HTTP proxy plus a scan engine
    # that will make arbitrary requests on behalf of whoever reaches it, so
    # exposing this port beyond localhost hands that to the whole network.
    # If you genuinely need it reachable from another host, set an API key
    # in the Dockerfile's CMD and thread it through ZAPv2(apikey=...)
    # first — do not simply widen this binding.
    ports:
      - "127.0.0.1:8090:8090"

    # NO volume for /home/zap/.ZAP, on purpose.
    #
    # A persistent profile is exactly the thing this container exists to
    # avoid: it is what lets a corrupted or self-uninstalled add-on survive
    # a restart, which is the failure mode documented in WRITEUP.md §3.1.
    # Keeping the profile inside the container's own writable layer is what
    # makes `docker compose restart zap` a real fix rather than a reboot
    # that changes nothing.

    # ---- REACHING YOUR TARGETS -------------------------------------------
    # The single most likely thing to go wrong with this container, hit
    # during its own verification: ZAP runs in ITS network namespace, not
    # yours. A target you can curl from the host may be unroutable from
    # inside the container, and a containerised daemon has its own routing,
    # DNS and firewall view.
    #
    # Measured here: the scanner could reach the local DVWA lab at
    # 172.28.0.20 fine, while this container could not (the lab sits on
    # test-targets_aegis-test-net). ZAP reported a complete spider and zero
    # alerts — a clean-looking result for a host it never fetched a page
    # from. zap_wrap.py now detects that (it checks ZAP's own site tree, not
    # the spider's attempted-URL list) and reports it as a tool FAILURE, so
    # the misconfiguration is loud instead of silent. But the fix is here:
    #
    #   - scanning INTERNET targets: works as shipped, nothing to do
    #   - scanning another COMPOSE PROJECT's containers: attach this service
    #     to that project's network, e.g.
    #
    #       networks:
    #         - default
    #         - test-targets_aegis-test-net
    #
    #     and declare it at the bottom of this file:
    #
    #       networks:
    #         test-targets_aegis-test-net:
    #           external: true
    #
    #   - scanning something on the DOCKER HOST itself: reach it at
    #     host.docker.internal (add `extra_hosts: ["host.docker.internal:
    #     host-gateway"]`), not 127.0.0.1 — inside the container, 127.0.0.1
    #     is the container.

    healthcheck:
      # The version endpoint is the same readiness signal zap_wrap.py polls
      # for, so "healthy" here means precisely "a scan would now succeed"
      # rather than "the process started".
      test: ["CMD", "curl", "-sf", "http://localhost:8090/JSON/core/view/version/"]
      interval: 10s
      timeout: 5s
      # ZAP's cold start is genuinely slow; start_period stops Compose from
      # reporting it unhealthy while it is still legitimately booting.
      start_period: 90s
      retries: 5

    restart: unless-stopped

# --------------------------------------------------------------------- db
# Optional Postgres, off by default. Uncomment this whole block AND the
# app's `depends_on` above, then set DATABASE_URL in .env (see the note in
# the app service). SQLite-in-a-volume is the default so the stack needs no
# database service at all.
#
#  db:
#    image: postgres:16-alpine
#    container_name: aegis-shield-db
#    environment:
#      POSTGRES_USER: aegis
#      POSTGRES_PASSWORD: aegis
#      POSTGRES_DB: aegis
#    volumes:
#      - aegis-pgdata:/var/lib/postgresql/data
#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U aegis"]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#    restart: unless-stopped

volumes:
  aegis-appdata:   # SaaS database (users, subscriptions, scan jobs)
  aegis-scandb:    # Aegis engine's own scan-history SQLite
  aegis-output:    # generated TXT/PDF/HTML reports
  # aegis-pgdata:  # uncomment with the Postgres `db` service above
